# Copy to config.yaml (ignored by Git); fill in your own collection key.
zotero:
  base_url: http://localhost:23119/api/
  library: users/0             # Personal local library; groups/<numeric-id> also supported.
  collection_key: REPLACE_ME  # Eight uppercase letters/digits from Zotero's collection URI.
  include_subcollections: true

attachments:
  # Unrecognized non-PDF files are reported as ignored. PDF filenames containing
  # supplement/supporting/appendix default to supplementary; other PDFs to main.
  # Override with actual Zotero attachment keys, never filenames:
  overrides: {}              # {ABCDEFGH: main, IJKLMNPQ: supplementary, RSTUVWXY: ignore}
  # Alternatively tag attachments research-vault:main or research-vault:supplementary.

# Optional local page-level fallback. No sources are uploaded to an OCR service.
# Install Tesseract and the chosen language data in the same OS as Python (WSL:
# Linux Tesseract). Diagnostics inspect native text only and never run OCR.
ocr:
  enabled: false
  executable: tesseract       # PATH command or local executable path; no shell arguments.
  language: eng              # Installed Tesseract languages, e.g. eng+ita.
  dpi: 150                   # Render only deficient pages (maximum 600).
  timeout_seconds: 60        # Per-page Tesseract timeout.
  min_text_chars: 10         # Minimum non-whitespace characters; a heuristic, not quality assurance.

# Explicit authorized directories for works.yaml sources and recursive includes.
# Relative paths resolve from the vault; local absolute paths and file URLs work too.
# WSL accepts Windows paths here and in works.yaml; wslpath translates them.
# Use YAML single quotes for Windows backslashes, or use forward slashes.
# Give each manuscript project directory, not a broad home or filesystem directory.
source_roots: []

llm:
  default_provider: codex     # Existing vaults without llm settings continue to use Codex.
  agents: {}                 # Role names: literature, manuscript, concepts, linking, synthesis, maintenance.
  # Example mixed workflow (instead of agents: {}):
  # agents:
  #   literature: codex
  #   linking: {provider: claude, model: sonnet}
  #   synthesis: claude
  evaluation:
    enabled: false           # Extra inference/cost; results stay private and never create proposals.
    provider: claude          # Secondary runtime for scheduled jobs; same-provider comparisons are skipped.

codex:
  executable: codex          # Native binary or standard npm codex.cmd shim; local absolute paths allowed.
  model: null                # Use CLI default; optionally set an account-supported model.
  timeout_seconds: 600
  max_input_chars: 500000     # Per-request total budget, never a collection-wide limit.
  # Budget includes instruction files, schema, JSON context and this expected output reserve.
  # Character counts are conservative safety controls, not model-token measurements.
  output_reserve_chars: 16000

claude:
  executable: claude         # Native CLI recommended; standard npm claude.cmd is also supported.
  model: null                # Use Claude CLI default or an account-supported model ID/alias.
  timeout_seconds: 600
  max_input_chars: 500000
  output_reserve_chars: 16000

processing:
  chunk_chars: 60000           # Target serialized source characters per summary chunk.
  graph_neighbors: 8           # Candidate notes retrieved for each changed note fragment.
  graph_fragment_chars: 12000  # All note text is indexed in fragments of at most this size.
  retrieval_passages: 4        # Maximum original source excerpts added per reasoning request.
  passage_chars: 2000          # Maximum characters per retrieved excerpt.
  chunk_context_chars: 600    # Adjacent explanatory text around section/math-aware source chunks.
  candidate_terms: 32        # Maximum rare query terms used per registry fragment.
  candidate_pool: 128        # Hard bound on candidate fragments scored per query.
  startup_max_documents: 5   # --startup caps document work and defers concept/reasoning stages.
